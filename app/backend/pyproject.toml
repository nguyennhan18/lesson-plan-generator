[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lessonai-backend"
version = "0.2.0"
description = "LessonAI-5512 lesson planning and presentation API"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["lessonai*"]

[tool.setuptools.package-data]
lessonai = ["templates/*.pptx", "templates/*.json"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

markers = ["critical_regressions: release-blocking containment and behavior checks", "corpus_integration: requires the local untracked curriculum/corpus and historical artifacts"]

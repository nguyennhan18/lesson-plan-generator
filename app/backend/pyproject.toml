[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lessonai-backend"
version = "0.2.0"
description = "LessonAI-5512 lesson planning and presentation API"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["lessonai*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

markers = ["critical_regressions: release-blocking containment and behavior checks", "corpus_integration: requires the local untracked curriculum/corpus and historical artifacts"]

# Luật tầng của backend, do CI cưỡng chế qua `make lint` (AGENTS.md, Code Conventions).
# Mũi tên nghĩa là "được phép import"; mọi import đi ngược chiều sẽ làm CI đỏ.
[tool.importlinter]
root_package = "lessonai"

[[tool.importlinter.contracts]]
name = "Thu tu tang: api|tooling > exporters > services > llm|rag|parsers|prompts > schemas > core|utils"
type = "layers"
layers = [
    "lessonai.api | lessonai.tooling",
    "lessonai.exporters",
    "lessonai.services",
    "lessonai.llm | lessonai.rag | lessonai.parsers | lessonai.prompts",
    "lessonai.schemas",
    "lessonai.core | lessonai.utils",
]
# Chỉ còn một ngoại lệ lâu dài.
ignore_imports = [
    # Validator của LessonRequest/OutlineRequest gọi infer_lesson_id của registry.
    # Sửa chỗ này là đổi hành vi phân tích request, nên tách thành việc riêng.
    "lessonai.schemas.schemas -> lessonai.rag.curriculum_registry",
]

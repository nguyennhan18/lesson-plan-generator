name: Project checks
on: [push, pull_request]
jobs:
  acceptance:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ''
      GROQ_API_KEY: ''
      OPENROUTER_API_KEY: ''
      LESSONAI_TEST_PYTHON: python
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/backend/requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: python -m pip install -r app/backend/requirements-lock.txt
      - run: python -m pip install --no-deps -e ./app/backend
      - run: npm --prefix app/frontend ci
      - run: make test-portable PYTHON=python
      - run: make test-critical-backend PYTHON=python
      - run: make test-frontend
      - run: make audit-acceptance PYTHON=python REVIEW_OUTPUT=/tmp/lessonai-acceptance
      - run: npx playwright install --with-deps chromium
        working-directory: app/frontend
      - run: make test-e2e
      - run: npm --prefix app/frontend audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-evidence
          path: |
            /tmp/lessonai-acceptance*.json
            app/frontend/playwright-report/
            app/frontend/test-results/

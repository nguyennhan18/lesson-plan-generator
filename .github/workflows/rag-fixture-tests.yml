name: RAG fixture tests
on: [push, pull_request]
jobs:
  rag-fixture-tests:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ''
      GROQ_API_KEY: ''
      OPENROUTER_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r app/backend/requirements-lock.txt
      - run: python -m pip install --no-deps -e app/backend
      - run: python -m pytest -c app/backend/pyproject.toml app/backend/tests/test_rag_question_triage.py app/backend/tests/test_retrieval_fixture.py --junitxml=rag-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rag-test-results
          path: rag-tests.xml
